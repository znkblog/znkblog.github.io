  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/proj4@2.11.0/dist/proj4.js"></script>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const csvText = document.getElementById("csv-data").textContent.trim();
      const colors = ["#fff7bc", "#fee391", "#fec44f", "#fe9929", "#ec7014", "#cc4c02", "#d7301f", "#b30000", "#7f0000"];
      const opacity = 0.7;
      const yieldToBrowser = () => new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));

      if (!window.L || !window.proj4) {
        status.textContent = "지도 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.";
        return;
      }

      try {
        proj4.defs("EPSG:5174", "+proj=tmerc +lat_0=38 +lon_0=127.0028902777778 +k=1 +x_0=200000 +y_0=500000 +ellps=bessel +towgs84=-115.80,474.99,674.11,1.16,-2.31,-1.63,6.43 +units=m +no_defs +type=crs");
        proj4.defs("EPSG:3857", "+proj=merc +a=6378137 +b=6378137 +lat_ts=0 +lon_0=0 +x_0=0 +y_0=0 +k=1 +units=m +nadgrids=@null +no_defs");

        status.textContent = "HTML에 포함된 CSV를 확인하고 있습니다...";
        await yieldToBrowser();
        const firstLineEnd = csvText.indexOf("\n");
        if (firstLineEnd < 0) throw new Error("CSV 헤더를 찾지 못했습니다.");
        const headers = csvText.slice(0, firstLineEnd).replace(/\r$/, "").replace(/^\uFEFF/, "").split(",");
        const columns = {
          id: headers.indexOf("격자ID"),
          x: headers.indexOf("격자좌상단좌표정보(X)"),
          y: headers.indexOf("격자좌하단좌표정보(Y)"),
          count: headers.indexOf("음식점카운팅")
        };
        if (Object.values(columns).some(index => index < 0)) {
          throw new Error("CSV 칼럼을 찾지 못했습니다.");
        }

        const gridOriginX = -10000;
        const gridTopY = 565000;
        const cellWidth = 1000;
        const cellHeight = 1000;
        const columnsCount = 556;
        const rowsCount = 609;
        const gridSize = columnsCount * rowsCount;
        let rowCount = 0;
        for (let i = firstLineEnd + 1; i < csvText.length; i++) {
          if (csvText.charCodeAt(i) === 10) rowCount++;
        }
        if (csvText.charCodeAt(csvText.length - 1) !== 10) rowCount++;
        if (!rowCount) throw new Error("CSV에 격자 데이터가 없습니다.");

        const gridCounts = new Uint32Array(gridSize);
        const cellsByRow = Array.from({ length: rowsCount }, () => []);
        let maxCount = 0;
        let positiveCount = 0;
        let cursor = firstLineEnd + 1;
        for (let index = 0; index < rowCount; index++) {
          let end = csvText.indexOf("\n", cursor);
          if (end < 0) end = csvText.length;
          if (end > cursor && csvText.charCodeAt(end - 1) === 13) end--;
          const comma1 = csvText.indexOf(",", cursor);
          const comma2 = csvText.indexOf(",", comma1 + 1);
          const comma3 = csvText.indexOf(",", comma2 + 1);
          if (comma1 < 0 || comma1 >= end || comma2 < 0 || comma2 >= end || comma3 < 0 || comma3 >= end) {
            throw new Error(`${index + 1}번째 CSV 행의 형식이 올바르지 않습니다.`);
          }
          const x = Number(csvText.slice(comma1 + 1, comma2));
          const y = Number(csvText.slice(comma2 + 1, comma3));
          const count = Number(csvText.slice(comma3 + 1, end));
          if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(count)) {
            throw new Error("숫자가 아닌 좌표 또는 음식점 수가 CSV에 있습니다.");
          }
          if (count <= 0) throw new Error("압축 CSV에는 음식점 수가 1 이상인 격자만 있어야 합니다.");
          const col = (x - gridOriginX) / cellWidth;
          const row = (gridTopY - y) / cellHeight;
          if (!Number.isInteger(col) || !Number.isInteger(row) ||
              col < 0 || col >= columnsCount || row < 0 || row >= rowsCount) {
            throw new Error("CSV 좌표가 격자 범위를 벗어났습니다.");
          }
          const cell = row * columnsCount + col;
          const expectedId = `G${String(cell + 1).padStart(6, "0")}`;
          if (csvText.slice(cursor, comma1) !== expectedId || gridCounts[cell] !== 0) {
            throw new Error("CSV 격자 ID가 순서와 맞지 않거나 좌표가 중복되었습니다.");
          }
          gridCounts[cell] = count;
          cellsByRow[row].push({ col, count });
          positiveCount++;
          if (count > maxCount) maxCount = count;
          cursor = end + (csvText.charCodeAt(end) === 13 ? 2 : 1);
          if ((index + 1) % 5000 === 0) {
            status.textContent = `음식점이 있는 격자 자료를 읽고 있습니다... ${(index + 1).toLocaleString("ko-KR")} / ${rowCount.toLocaleString("ko-KR")}`;
            await yieldToBrowser();
          }
        }

        status.textContent = "EPSG:5174 좌표를 지도 좌표계로 변환하고 있습니다...";
        await yieldToBrowser();
        const vertexColumns = columnsCount + 1;
        const vertexCount = vertexColumns * (rowsCount + 1);
        const worldX = new Float64Array(vertexCount);
        const worldY = new Float64Array(vertexCount);
        worldX.fill(NaN);
        worldY.fill(NaN);
        const xEdges = Array.from({ length: columnsCount + 1 }, (_, col) => gridOriginX + col * cellWidth);
        const yEdges = Array.from({ length: rowsCount + 1 }, (_, row) => gridTopY - row * cellHeight);
        const positiveCells = [];
        for (let row = 0; row < rowsCount; row++) {
          for (const cell of cellsByRow[row]) positiveCells.push({ row, col: cell.col, count: cell.count });
        }
        const getVertex = (row, col) => {
          const vertex = row * vertexColumns + col;
          if (Number.isNaN(worldX[vertex])) {
            const projected = proj4("EPSG:5174", "EPSG:3857", [xEdges[col], yEdges[row]]);
            worldX[vertex] = projected[0];
            worldY[vertex] = projected[1];
          }
          return vertex;
        };
        const bounds = L.latLngBounds([]);
        const addBoundVertex = (row, col) => {
          const vertex = getVertex(row, col);
          const [lng, lat] = proj4("EPSG:3857", "EPSG:4326", [worldX[vertex], worldY[vertex]]);
          bounds.extend([lat, lng]);
        };
        for (let col = 0; col <= columnsCount; col++) {
          addBoundVertex(0, col);
          addBoundVertex(rowsCount, col);
        }
        for (let row = 1; row < rowsCount; row++) {
          addBoundVertex(row, 0);
          addBoundVertex(row, columnsCount);
        }
        for (let index = 0; index < positiveCells.length; index++) {
          const cell = positiveCells[index];
          getVertex(cell.row, cell.col);
          getVertex(cell.row, cell.col + 1);
          getVertex(cell.row + 1, cell.col);
          getVertex(cell.row + 1, cell.col + 1);
          if ((index + 1) % 5000 === 0) {
            status.textContent = `음식점 격자 좌표를 변환하고 있습니다... ${(index + 1).toLocaleString("ko-KR")} / ${positiveCells.length.toLocaleString("ko-KR")}`;
            await yieldToBrowser();
          }
        }
        const legend = document.getElementById("legend");
        const stats = document.getElementById("stats");
        const map = L.map("map", { preferCanvas: true, zoomSnap: 0.25 });
        L.tileLayer("https://tile.openstreetmap.de/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let breakValues = [10, 50, 100, 200];
        let bins = [];
        let gridLayer;
        const bandColors = [colors[0], colors[2], colors[4], colors[6], colors[8]];
        const makeBins = () => {
          const upperBounds = [...breakValues, maxCount];
          let lower = 1;
          return upperBounds.map((upper, index) => {
            const bin = { lower, upper, color: bandColors[index] };
            lower = upper + 1;
            return bin;
          });
        };

        const GridCanvasLayer = L.GridLayer.extend({
          createTile(coords, done) {
            const tile = document.createElement("canvas");
            const tileSize = this.getTileSize();
            tile.width = tileSize.x;
            tile.height = tileSize.y;
            const context = tile.getContext("2d");
            requestAnimationFrame(() => {
              try {
                const zoom = coords.z;
                const worldSize = 256 * Math.pow(2, zoom);
                const scale = worldSize / (2 * Math.PI * 6378137);
                const pixelLeft = coords.x * tileSize.x;
                const pixelTop = coords.y * tileSize.y;
                const corners = [
                  [pixelLeft, pixelTop],
                  [pixelLeft + tileSize.x, pixelTop],
                  [pixelLeft, pixelTop + tileSize.y],
                  [pixelLeft + tileSize.x, pixelTop + tileSize.y]
                ];
                let minX = Infinity;
                let maxX = -Infinity;
                let minY = Infinity;
                let maxY = -Infinity;
                for (const [pixelX, pixelY] of corners) {
                  const latlng = map.options.crs.pointToLatLng(L.point(pixelX, pixelY), zoom);
                  const [x, y] = proj4("EPSG:4326", "EPSG:5174", [latlng.lng, latlng.lat]);
                  minX = Math.min(minX, x);
                  maxX = Math.max(maxX, x);
                  minY = Math.min(minY, y);
                  maxY = Math.max(maxY, y);
                }
                const firstCol = Math.max(0, Math.floor((minX - gridOriginX) / cellWidth) - 2);
                const lastCol = Math.min(columnsCount - 1, Math.floor((maxX - gridOriginX) / cellWidth) + 2);
                const firstRow = Math.max(0, Math.floor((gridTopY - maxY) / cellHeight) - 2);
                const lastRow = Math.min(rowsCount - 1, Math.floor((gridTopY - minY) / cellHeight) + 2);
                const paths = Array.from({ length: bins.length }, () => new Path2D());
                if (firstCol <= lastCol && firstRow <= lastRow) {
                  for (let row = firstRow; row <= lastRow; row++) {
                    for (const cell of cellsByRow[row]) {
                      if (cell.col < firstCol || cell.col > lastCol) continue;
                      let group = 0;
                      while (group < bins.length - 1 && cell.count > bins[group].upper) group++;
                      const topLeft = row * vertexColumns + cell.col;
                      const topRight = topLeft + 1;
                      const bottomLeft = topLeft + vertexColumns;
                      const bottomRight = bottomLeft + 1;
                      const x1 = worldX[topLeft] * scale + worldSize / 2 - pixelLeft;
                      const y1 = worldSize / 2 - worldY[topLeft] * scale - pixelTop;
                      const x2 = worldX[topRight] * scale + worldSize / 2 - pixelLeft;
                      const y2 = worldSize / 2 - worldY[topRight] * scale - pixelTop;
                      const x3 = worldX[bottomRight] * scale + worldSize / 2 - pixelLeft;
                      const y3 = worldSize / 2 - worldY[bottomRight] * scale - pixelTop;
                      const x4 = worldX[bottomLeft] * scale + worldSize / 2 - pixelLeft;
                      const y4 = worldSize / 2 - worldY[bottomLeft] * scale - pixelTop;
                      paths[group].moveTo(x1, y1);
                      paths[group].lineTo(x2, y2);
                      paths[group].lineTo(x3, y3);
                      paths[group].lineTo(x4, y4);
                      paths[group].closePath();
                    }
                  }
                }
                paths.forEach((path, index) => {
                  context.fillStyle = bins[index].color;
                  context.globalAlpha = opacity;
                  context.fill(path);
                });
                context.globalAlpha = 1;
                done(null, tile);
              } catch (error) {
                console.error(error);
                done(error, tile);
              }
            });
            return tile;
          }
        });
        const renderLegend = () => {
          const swatch = (color, alpha) => `rgba(${parseInt(color.slice(1, 3), 16)},${parseInt(color.slice(3, 5), 16)},${parseInt(color.slice(5, 7), 16)},${alpha})`;
          const items = ['<div class="legend-item"><span class="swatch"></span><span class="legend-range">0개 (투명)</span></div>'];
          bins.forEach((bin, index) => {
            const range = `${bin.lower}–${bin.upper}개`;
            const boundary = index < breakValues.length
              ? `<label class="legend-break">상한 <input type="number" min="1" max="${maxCount - 1}" step="1" value="${breakValues[index]}" data-break-index="${index}" aria-label="${index + 1}구간 상한"></label>`
              : "";
            items.push(`<div class="legend-item"><span class="swatch" style="background:${swatch(bin.color, opacity)}"></span><span class="legend-range">${range}</span>${boundary}</div>`);
          });
          legend.innerHTML = items.join("");
        };

        legend.addEventListener("change", event => {
          const input = event.target;
          if (!input.matches("[data-break-index]")) return;
          const index = Number(input.dataset.breakIndex);
          const value = Number(input.value);
          const nextBreaks = [...breakValues];
          nextBreaks[index] = value;
          const ordered = nextBreaks.every((item, position) =>
            Number.isInteger(item) && item > 0 && item < maxCount &&
            (position === 0 || item > nextBreaks[position - 1]) &&
            (position === nextBreaks.length - 1 || item < nextBreaks[position + 1])
          );
          if (!ordered) {
            status.textContent = `구간 상한은 1부터 ${maxCount - 1}까지 입력하고, 왼쪽에서 오른쪽으로 갈수록 큰 값을 지정해 주세요.`;
            input.focus();
            return;
          }
          breakValues = nextBreaks;
          bins = makeBins();
          renderLegend();
          gridLayer.redraw();
          status.textContent = "색상 구간을 적용했습니다.";
        });

        map.on("click", event => {
          const [x, y] = proj4("EPSG:4326", "EPSG:5174", [event.latlng.lng, event.latlng.lat]);
          const col = Math.floor((x - gridOriginX) / cellWidth);
          const row = Math.floor((gridTopY - y) / cellHeight);
          if (col < 0 || col >= columnsCount || row < 0 || row >= rowsCount) return;
          const cell = row * columnsCount + col;
          const id = `G${String(cell + 1).padStart(6, "0")}`;
          const content = document.createElement("div");
          const title = document.createElement("div");
          const value = document.createElement("div");
          title.className = "popup-title";
          title.textContent = `격자 ${id}`;
          value.className = "popup-value";
          value.textContent = `음식점 ${gridCounts[cell].toLocaleString("ko-KR")}개`;
          content.append(title, value);
          L.popup().setLatLng(event.latlng).setContent(content).openOn(map);
        });

        map.fitBounds(bounds, { padding: [18, 18] });
        bins = makeBins();
        renderLegend();
        gridLayer = new GridCanvasLayer({ tileSize: 256, keepBuffer: 2 }).addTo(map);
        gridLayer.on("tileerror", event => {
          console.error("격자 타일을 그리지 못했습니다.", event.error);
          status.textContent = "격자를 그리지 못했습니다. 브라우저 콘솔에서 오류를 확인해 주세요.";
        });
        stats.innerHTML = `전체 격자: ${gridSize.toLocaleString("ko-KR")}개<br>음식점 있는 격자: ${positiveCount.toLocaleString("ko-KR")}개<br>격자 크기: ${cellWidth.toLocaleString("ko-KR")} × ${cellHeight.toLocaleString("ko-KR")}m<br>좌표 변환: EPSG:5174 → EPSG:4326`;
        status.textContent = "준비가 완료되었습니다. 지도 타일을 불러오려면 인터넷 연결이 필요합니다.";
      } catch (error) {
        console.error(error);
        status.textContent = `지도를 준비하지 못했습니다: ${error.message}`;
      }
    })();
  </script>
